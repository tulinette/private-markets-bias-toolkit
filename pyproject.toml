[project]
name = "biastk"
version = "0.1.0"
description = "Survivorship- and lookahead-bias correction toolkit for private-markets scoring models"
requires-python = ">=3.10"
dependencies = ["pandas", "numpy", "scikit-learn", "lifelines"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]